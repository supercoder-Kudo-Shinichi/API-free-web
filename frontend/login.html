<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Chat chít</title>
    <meta name="description" content="Sign in to your AuthGuard account.">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-bg"></div>
        <div class="auth-container">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="css/img/authss.png" alt="AuthGuard" class="logo-img-sm">
                    <span>Chat chít</span>
                </a>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Sign in to your account to continue.</p>
            </div>

            <div class="auth-card">
                <!-- Error/Success Message -->
                <div id="auth-message" class="auth-message" style="display:none;"></div>

                <!-- Google Login -->
                <button id="google-login-btn" class="social-login google" onclick="handleGoogleLogin()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v12M6 12h12"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="auth-divider">
                    <span class="auth-divider-line"></span>
                    <span class="auth-divider-text">or sign in with email</span>
                    <span class="auth-divider-line"></span>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form" onsubmit="handleLogin(event)" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="usernameOrEmail">Username or Email</label>
                        <input class="form-input" type="text" id="usernameOrEmail" name="usernameOrEmail" placeholder="Enter your username or email" required autocomplete="username">
                        <span class="form-error" id="usernameOrEmail-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="password-toggle" onclick="togglePassword('password')" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <span class="form-error" id="password-error"></span>
                    </div>

                    <button type="submit" id="login-submit" class="btn btn-primary btn-block btn-lg">
                        <span id="login-text">Sign In</span>
                        <span id="login-spinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
        }

        // Show error message
        function showMessage(message, type = 'error') {
            const el = document.getElementById('auth-message');
            el.style.display = 'flex';
            el.className = `auth-message ${type}`;
            el.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    ${type === 'error' ? '<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>' : ''}
                    ${type === 'success' ? '<circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/>' : ''}
                    ${type === 'info' ? '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>' : ''}
                </svg>
                <span>${message}</span>
            `;
        }

        // Google Sign-In using Google Identity Services
        function initGoogleSignIn() {
            const googleBtn = document.getElementById('google-login-btn');
            const clientId = CONFIG.GOOGLE.CLIENT_ID;

            if (!clientId) {
                googleBtn.onclick = function() {
                    Utils.showToast(
                        'Google OAuth will be available after configuring GOOGLE_CLIENT_ID in backend.',
                        'info'
                    );
                };
                return;
            }

            const script = document.createElement('script');
            script.src = 'https://accounts.google.com/gsi/client';
            script.async = true;
            script.defer = true;
            script.onload = () => {
                google.accounts.id.initialize({
                    client_id: clientId,
                    callback: handleGoogleCredentialResponse,
                });
                google.accounts.id.renderButton(googleBtn, {
                    theme: 'outline',
                    size: 'large',
                    width: googleBtn.offsetWidth || 400,
                    text: 'signin_with',
                    shape: 'rectangular',
                });
                googleBtn.onclick = null;
            };
            document.head.appendChild(script);
        }

        async function handleGoogleCredentialResponse(response) {
            const btn = document.getElementById('google-login-btn');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                const data = await Auth.googleLogin(response.credential);
                if (data.success) {
                    Utils.showToast('Signed in with Google! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                }
            } catch (err) {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                showMessage(err.message || 'Google sign-in failed. Please try again.', 'error');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const usernameOrEmail = document.getElementById('usernameOrEmail').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('login-submit');
            const loginText = document.getElementById('login-text');
            const loginSpinner = document.getElementById('login-spinner');

            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));

            let hasError = false;
            if (!usernameOrEmail) {
                document.getElementById('usernameOrEmail-error').textContent = 'Username or email is required.';
                document.getElementById('usernameOrEmail').classList.add('error');
                hasError = true;
            }
            if (!password) {
                document.getElementById('password-error').textContent = 'Password is required.';
                document.getElementById('password').classList.add('error');
                hasError = true;
            }
            if (hasError) return;

            submitBtn.disabled = true;
            loginText.style.display = 'none';
            loginSpinner.style.display = 'inline-block';

            try {
                const data = await Auth.login(usernameOrEmail, password);
                if (data.success) {
                    Utils.showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                }
            } catch (err) {
                showMessage(err.message || 'Invalid credentials. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                loginText.style.display = 'inline';
                loginSpinner.style.display = 'none';
            }
        }

        Auth.init().then(authenticated => {
            if (authenticated) {
                window.location.href = 'index.html';
                return;
            }
            initGoogleSignIn();
        });
    </script>
    <script src="js/themes.js"></script>
</body>
</html>
