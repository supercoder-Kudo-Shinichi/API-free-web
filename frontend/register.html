<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Chat chít</title>
    <meta name="description" content="Create your AuthGuard account.">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-bg"></div>
        <div class="auth-container">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="css/img/authss.png" alt="AuthGuard" class="logo-img-sm">
                    <span>Chat chít</span>
                </a>
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-subtitle">Start chating free.</p>
            </div>

            <div class="auth-card">
                <div id="auth-message" class="auth-message" style="display:none;"></div>

                <button id="google-register-btn" class="social-login google" onclick="handleGoogleRegister()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v12M6 12h12"/>
                    </svg>
                    Sign up with Google
                </button>

                <div class="auth-divider">
                    <span class="auth-divider-line"></span>
                    <span class="auth-divider-text">or sign up with email</span>
                    <span class="auth-divider-line"></span>
                </div>

                <form id="register-form" class="auth-form" onsubmit="handleRegister(event)" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-input" type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username" minlength="3" maxlength="20">
                        <span class="form-hint">3-20 characters, letters, numbers, and underscores.</span>
                        <span class="form-error" id="username-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Gmail Address</label>
                        <input class="form-input" type="email" id="email" name="email" placeholder="you@gmail.com" required autocomplete="email">
                        <span class="form-error" id="email-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input class="form-input" type="password" id="password" name="password" placeholder="Create a strong password" required autocomplete="new-password" minlength="8">
                            <button type="button" class="password-toggle" onclick="togglePassword('password')" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <span class="form-hint">At least 8 characters.</span>
                        <span class="form-error" id="password-error"></span>
                    </div>

                    <button type="submit" id="register-submit" class="btn btn-primary btn-block btn-lg">
                        <span id="register-text">Create Account</span>
                        <span id="register-spinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
        }

        function showMessage(message, type = 'error') {
            const el = document.getElementById('auth-message');
            el.style.display = 'flex';
            el.className = `auth-message ${type}`;
            el.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    ${type === 'error' ? '<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>' : ''}
                    ${type === 'success' ? '<circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/>' : ''}
                    ${type === 'info' ? '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>' : ''}
                </svg>
                <span>${message}</span>
            `;
        }

        function initGoogleSignUp() {
            const googleBtn = document.getElementById('google-register-btn');
            const clientId = CONFIG.GOOGLE.CLIENT_ID;

            if (!clientId) {
                googleBtn.onclick = function() {
                    Utils.showToast(
                        'Google OAuth will be available after configuring GOOGLE_CLIENT_ID in backend.',
                        'info'
                    );
                };
                return;
            }

            const script = document.createElement('script');
            script.src = 'https://accounts.google.com/gsi/client';
            script.async = true;
            script.defer = true;
            script.onload = () => {
                google.accounts.id.initialize({
                    client_id: clientId,
                    callback: handleGoogleCredentialResponse,
                });
                google.accounts.id.renderButton(googleBtn, {
                    theme: 'outline',
                    size: 'large',
                    width: googleBtn.offsetWidth || 400,
                    text: 'signup_with',
                    shape: 'rectangular',
                });
                googleBtn.onclick = null;
            };
            document.head.appendChild(script);
        }

        async function handleGoogleCredentialResponse(response) {
            const btn = document.getElementById('google-register-btn');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating account...';

            try {
                const data = await Auth.googleLogin(response.credential);
                if (data.success) {
                    Utils.showToast('Account created with Google! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                }
            } catch (err) {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                showMessage(err.message || 'Google sign-up failed. Please try again.', 'error');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('register-submit');
            const registerText = document.getElementById('register-text');
            const registerSpinner = document.getElementById('register-spinner');

            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));

            let hasError = false;
            if (!Utils.isValidUsername(username)) {
                document.getElementById('username-error').textContent = 'Username must be 3-20 characters (letters, numbers, underscores).';
                document.getElementById('username').classList.add('error');
                hasError = true;
            }
            if (!Utils.isValidGmail(email)) {
                document.getElementById('email-error').textContent = 'Only Gmail addresses (@gmail.com) are allowed.';
                document.getElementById('email').classList.add('error');
                hasError = true;
            }
            if (!Utils.isValidPassword(password)) {
                document.getElementById('password-error').textContent = 'Password must be at least 8 characters.';
                document.getElementById('password').classList.add('error');
                hasError = true;
            }
            if (hasError) return;

            submitBtn.disabled = true;
            registerText.style.display = 'none';
            registerSpinner.style.display = 'inline-block';

            try {
                const data = await Auth.register(username, email, password);
                if (data.success) {
                    Utils.showToast('Account created! Welcome to AuthGuard.', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                }
            } catch (err) {
                showMessage(err.message || 'Registration failed. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                registerText.style.display = 'inline';
                registerSpinner.style.display = 'none';
            }
        }

        Auth.init().then(authenticated => {
            if (authenticated) {
                window.location.href = 'index.html';
                return;
            }
            initGoogleSignUp();
        });
    </script>
    <script src="js/themes.js"></script>
</body>
</html>
